$kind: http-request
url: "{{BASE_URL}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"avalosalan789@gmail.com\",\r

    \    \"password\": \"password123A_\"\r

    }"
scripts:
  - type: afterResponse
    code: "try {\r

      \    const response = pm.response.json();\r

      \    if (response.success) {\r

      \        if (response?.data?.accessToken) {\r

      \            pm.environment.set(\"ACCESS_TOKEN\",
      response.data.accessToken);\r

      \        }\r

      \    }\r

      } catch (error) {\r

      \    console.log(\"La respuesta no es JSON o no contiene accessToken\");\r

      }"
    language: text/javascript
examples: .resources/Login.resources/examples
order: 1000
